name: Build Android APK & Test Backend

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Test Dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Suite
        working-directory: ./backend
        run: python -m pytest -v

  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Android Project, TTS Manifest Queries & Neon Launcher Icon
        working-directory: ./flutter_app
        run: |
          cp android/app/src/main/AndroidManifest.xml /tmp/custom_AndroidManifest.xml || true
          flutter create . --platforms=android
          if [ -f /tmp/custom_AndroidManifest.xml ]; then
            cp /tmp/custom_AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          fi
          python3 tool/generate_launcher_icons.py
          if [ -f google-services.json ]; then
            cp google-services.json android/app/google-services.json
          fi

      - name: Get Flutter Dependencies
        working-directory: ./flutter_app
        run: flutter pub get

      - name: Build Release APK
        working-directory: ./flutter_app
        run: flutter build apk --release

      - name: Publish Direct APK to GitHub Releases (No ZIP Needed)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp flutter_app/build/app/outputs/flutter-apk/app-release.apk TruthLensPro-release.apk
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest TruthLensPro-release.apk --clobber
          else
            gh release create latest TruthLensPro-release.apk \
              --title "Truth Lens Pro v4.1 (Latest Android APK)" \
              --notes "Direct Android APK download — Automatic TTS Voice Verdict (Android 11+ queries), Google Sign-In + SharedPreferences, 22-Point Forensic Suite, Dual Mode, Session History & Admin Panel."
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TruthVerify-Release-APK
          path: TruthLensPro-release.apk
          compression-level: 0
