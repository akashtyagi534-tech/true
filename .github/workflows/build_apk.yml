name: Build Android APK & Test Backend

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Test Dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Suite
        working-directory: ./backend
        run: python -m pytest -v

  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Android Folder & Permissions
        working-directory: ./flutter_app
        run: |
          flutter create . --platforms=android
          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n    <uses-permission android:name="android.permission.CAMERA"\/>\n    <uses-permission android:name="android.permission.RECORD_AUDIO"\/>\n    <application/' android/app/src/main/AndroidManifest.xml

      - name: Get Flutter Dependencies
        working-directory: ./flutter_app
        run: flutter pub get

      - name: Build Release APK
        working-directory: ./flutter_app
        run: flutter build apk --release

      - name: Publish Direct APK to GitHub Releases (No ZIP Needed)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp flutter_app/build/app/outputs/flutter-apk/app-release.apk TruthLensPro-release.apk
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest TruthLensPro-release.apk --clobber
          else
            gh release create latest TruthLensPro-release.apk \
              --title "Truth Lens Pro (Latest Android APK)" \
              --notes "Direct Android APK download — no ZIP extraction required."
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TruthVerify-Release-APK
          path: TruthLensPro-release.apk
          compression-level: 0
