name: Build Android APK & Test Backend

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Core Test Dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install fastapi sqlalchemy pydantic-settings httpx pytest

      - name: Run Pytest Suite
        working-directory: ./backend
        run: pytest -v

  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Android Folder & Permissions
        working-directory: ./flutter_app
        run: |
          flutter create . --platforms=android
          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n    <uses-permission android:name="android.permission.CAMERA"\/>\n    <uses-permission android:name="android.permission.RECORD_AUDIO"\/>\n    <application/' android/app/src/main/AndroidManifest.xml

      - name: Get Dependencies & Build APK
        working-directory: ./flutter_app
        run: |
          flutter pub get
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TruthVerify-Release-APK
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
